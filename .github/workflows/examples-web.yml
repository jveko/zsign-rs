name: examples/web

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build examples/web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: wasm-pack
      - name: Build wasm package for examples/web
        run: wasm-pack build crates/zsign-wasm --target web --release
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install example dependencies
        run: npm ci
        working-directory: examples/web
      - name: Build example
        run: npm run build
        working-directory: examples/web
