name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (hk check)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v4
      - name: Run hooks on changed files
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            hk check --pr
          else
            hk check --all
          fi
      - name: Check formatting (all files)
        run: cargo fmt --all -- --check
      - name: Clippy (workspace, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (workspace)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  test-release:
    name: Test (workspace, release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The skip excludes a known zip entry-order nondeterminism flake; the
      # debug test job still runs that test unchanged.
      - name: Run tests (release)
        run: cargo test --workspace --release -- --skip test_ipa_signing_is_deterministic

  windows-check:
    name: Check (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Check-only for this iteration; running the suite on Windows is a
      # documented follow-up.
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets

  wasm:
    name: Build wasm32
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check wasm32
        run: cargo check -p zsign-wasm --target wasm32-unknown-unknown
      - name: Release build wasm32
        run: cargo build -p zsign-wasm --target wasm32-unknown-unknown --release
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2.87.20
        with:
          tool: wasm-pack
      - name: Run wasm tests (node)
        run: wasm-pack test --node crates/zsign-wasm

  interop:
    name: Apple codesign interop (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release zsign-cli
        run: cargo build -p zsign-cli --release
      - name: Sign + verify with Apple codesign
        run: scripts/verify-apple-interop.sh
      - name: Upload interop diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: interop-diagnostics
          path: target/interop-diagnostics.log

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          rust-version: "1.88.0"

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check against the declared MSRV
        run: cargo check --workspace --all-targets
