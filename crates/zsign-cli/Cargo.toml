[package]
name = "zsign-cli"
version = "0.1.1"
edition = "2021"
description = "Cross-platform iOS code signing CLI - Rust port of zsign"
license = "MIT"
repository = "https://github.com/jveko/zsign-rs"

[dependencies]
zsign-rs = { path = "../zsign", version = "0.1.2", default-features = true }
clap = { version = "4.5.53", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"
