[package]
name = "zsign-wasm"
version = "0.1.1"
edition = "2021"
authors = ["jveko"]
description = "WASM bindings for zsign iOS code signing"
license = "MIT"
repository = "https://github.com/jveko/zsign-rs"
keywords = ["ios", "codesign", "wasm", "mach-o", "ipa"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zsign-core = { path = "../zsign-core", version = "0.1.0" }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
plist = "1.7"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"
